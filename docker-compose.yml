# HazeCast SG -- local proof-of-concept stack.
#   docker compose up --build
#
# Brings up: MLflow tracking server, Airflow (webserver+scheduler, dev-mode
# SequentialExecutor), and the FastAPI scoring endpoint. Airflow uses the
# official image with _PIP_ADDITIONAL_REQUIREMENTS for our extra deps --
# fine for a class project / local dev, but Astronomer's own docs say not
# to do this in production (rebuild-on-every-start cost); a custom image
# per docker/pipeline.Dockerfile's pattern would replace it there.
#
# First run: `docker compose run --rm airflow-webserver airflow db init`
# then create a user, or set AIRFLOW__CORE__SIMPLE_AUTH_MANAGER... see
# README.md "Running it" for exact commands, since these vary by Airflow
# version and were not re-verified against a live pull in this sandbox
# (see README's "What's untested" section).

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    PYTHONPATH: /opt/airflow/src
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-pandas xgboost mlflow scikit-learn pyarrow}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - airflow_db:/opt/airflow

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - mlflow

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - mlflow

  api:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    command: uvicorn serving.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - mlflow

volumes:
  airflow_db:
  mlflow_data:
